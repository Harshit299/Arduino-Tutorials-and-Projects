<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labeled 7-Segment Display Simulator</title>
    <style>
        /* Base Reset & Layout */
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .simulator-container {
            display: flex;
            background-color: #e3decb;
            padding: 50px 60px 40px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        /* Power Rail (Left 5V Line) */
        .power-bus {
            border-left: 3px solid #2a5a3a;
            margin-top: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .power-label {
            position: absolute;
            top: -35px;
            left: -18px;
            color: #3b3ba1;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .power-triangle {
            width: 0; 
            height: 0; 
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid #3b3ba1;
            margin-top: 4px;
        }

        /* Individual Circuit Branches */
        .branch {
            display: flex;
            align-items: center;
            height: 40px; /* Slightly taller to accommodate labels */
        }

        .wire {
            height: 3px;
            background-color: #2a5a3a;
        }

        .wire-start { width: 30px; }
        .wire-mid { width: 30px; }
        .wire-end { width: 60px; border-radius: 0 4px 4px 0;}

        .resistor {
            width: 45px;
            height: 14px;
            background-color: #e3decb;
            border: 2px solid #8b2828;
            border-radius: 2px;
        }

        /* Switch Interactive Elements */
        .switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 50px;
            cursor: pointer;
            position: relative;
            padding: 10px 0;
        }

        /* Labels over the switches */
        .switch-label {
            position: absolute;
            top: -10px;
            width: 100%;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            color: #333;
            pointer-events: none; /* Prevents label from blocking clicks */
        }

        .node {
            width: 8px;
            height: 8px;
            background-color: transparent;
            border: 2px solid #8b2828;
            border-radius: 50%;
            z-index: 2;
        }

        .arm {
            position: absolute;
            left: 5px;
            top: 14px;
            width: 40px;
            height: 3px;
            background-color: #8b2828;
            transform-origin: left center;
            transform: rotate(-30deg); /* Open state */
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s;
        }

        .switch:hover .arm {
            background-color: #d13a3a;
        }

        .switch.closed .arm {
            transform: rotate(0deg); /* Closed state */
        }

        /* Display Container & Ground */
        .display-area {
            position: relative;
            margin-left: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 7-Segment Display Styling */
        .seven-segment {
            background-color: #3b0000;
            width: 110px;
            height: 170px;
            position: relative;
            border-radius: 6px;
            padding: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transform: skewX(-4deg); /* Slight slant to match real displays */
        }

        .segment {
            position: absolute;
            background-color: #1a331a; 
            transition: background-color 0.1s, box-shadow 0.1s, color 0.1s;
            
            /* Text alignment for the labels */
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4); /* Faded white when off */
            user-select: none;
        }

        .segment.on {
            background-color: #00ff00; 
            box-shadow: 0 0 12px #00ff00, inset 0 0 4px rgba(255,255,255,0.5);
            color: #000; /* Solid black when on for readability */
        }

        /* Segment Shapes utilizing clip-path */
        .seg-h {
            width: 60px;
            height: 18px;
            clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
        }

        .seg-v {
            width: 18px;
            height: 60px;
            clip-path: polygon(0 10%, 50% 0, 100% 10%, 100% 90%, 50% 100%, 0 90%);
        }

        /* Positioning the segments to form '8' */
        #seg-a { top: 15px; left: 35px; } /* Top */
        #seg-b { top: 31px; left: 91px; } /* Top Right */
        #seg-c { top: 94px; left: 91px; } /* Bottom Right */
        #seg-d { top: 152px; left: 35px; } /* Bottom */
        #seg-e { top: 94px; left: 21px; } /* Bottom Left */
        #seg-f { top: 31px; left: 21px; } /* Top Left */
        #seg-g { top: 84px; left: 35px; } /* Middle */

        /* Ground Wire (Bottom) */
        .ground-wire {
            width: 3px;
            height: 30px;
            background-color: #2a5a3a;
        }

        .ground-symbol {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .g-line { background-color: #2a5a3a; height: 3px; }
        .g-line-1 { width: 30px; }
        .g-line-2 { width: 20px; }
        .g-line-3 { width: 10px; }

    </style>
</head>
<body>

    <div class="simulator-container">
        
        <div class="power-bus">
            <div class="power-label">
                5V
                <div class="power-triangle"></div>
            </div>

            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-a" data-target="seg-a">
                    <div class="switch-label">A</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>
            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-b" data-target="seg-b">
                    <div class="switch-label">B</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>
            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-c" data-target="seg-c">
                    <div class="switch-label">C</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>
            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-d" data-target="seg-d">
                    <div class="switch-label">D</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>
            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-e" data-target="seg-e">
                    <div class="switch-label">E</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>
            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-f" data-target="seg-f">
                    <div class="switch-label">F</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>
            <div class="branch">
                <div class="wire wire-start"></div><div class="resistor"></div><div class="wire wire-mid"></div>
                <div class="switch" id="sw-g" data-target="seg-g">
                    <div class="switch-label">G</div>
                    <div class="node"></div><div class="arm"></div><div class="node"></div>
                </div>
                <div class="wire wire-end"></div>
            </div>

        </div>

        <div class="display-area">
            <div class="seven-segment">
                <div id="seg-a" class="segment seg-h">A</div>
                <div id="seg-b" class="segment seg-v">B</div>
                <div id="seg-c" class="segment seg-v">C</div>
                <div id="seg-d" class="segment seg-h">D</div>
                <div id="seg-e" class="segment seg-v">E</div>
                <div id="seg-f" class="segment seg-v">F</div>
                <div id="seg-g" class="segment seg-h">G</div>
            </div>

            <div class="ground-wire"></div>
            <div class="ground-symbol">
                <div class="g-line g-line-1"></div>
                <div class="g-line g-line-2"></div>
                <div class="g-line g-line-3"></div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Defaulted to show the number "0" (A-F ON, G OFF)
            const initialStates = {
                'sw-a': true,  
                'sw-b': true,  
                'sw-c': true,  
                'sw-d': true,  
                'sw-e': true,  
                'sw-f': true,  
                'sw-g': false  
            };

            const switches = document.querySelectorAll('.switch');

            switches.forEach(sw => {
                const targetId = sw.getAttribute('data-target');
                const segment = document.getElementById(targetId);

                // Apply initial state
                if (initialStates[sw.id]) {
                    sw.classList.add('closed');
                    segment.classList.add('on');
                }

                // Interaction
                sw.addEventListener('click', () => {
                    sw.classList.toggle('closed');
                    segment.classList.toggle('on');
                });
            });
        });
    </script>
</body>
</html>
